services:
  postgres:
    image: postgres:16
    container_name: saras_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saras
      POSTGRES_PASSWORD: saras_password
      POSTGRES_DB: saras_ai
    ports:
      - "5432:5432"
    volumes:
      - saras_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saras -d saras_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  saras_pg_data:
